# =====================================================
# SonarQube Project Configuration
# =====================================================

# Project Identification
sonar.projectKey=datapulse-enterprise-portal
sonar.projectName=DataPulse Enterprise Portal
sonar.projectVersion=1.0.0

# Source & Test Directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language Configurations
sonar.language=py,js,css,html
sonar.python.version=3.12
sonar.javascript.environments=browser

# Code Coverage Reports
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Inclusions & Exclusions
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/build/**,**/*.min.js,**/*.min.css
sonar.coverage.exclusions=src/static/**,tests/**

# Quality Gate Thresholds
sonar.qualitygate.wait=true
sonar.qualitygate.failOnSeverity=MAJOR

# Security & Vulnerability Scopes
sonar.security.hotspots.review=true
sonar.issue.ignore.multicriteria=
